# Docker Compose configuration for the royalty claims platform
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: royalties-claim-app
    ports:
      - "3001:3001"
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGINS: http://localhost:3001,http://localhost:8000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/royalties_claim
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 5242880
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: royalties-claim-postgres
    environment:
      POSTGRES_DB: royalties_claim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
