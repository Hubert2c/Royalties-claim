<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royalty Hub | Artist Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">R</div>
          <div>
            <p class="eyebrow">Artist portal</p>
            <h1>Royalty Hub</h1>
          </div>
        </div>

        <button id="logoutBtn" class="secondary-btn hidden" type="button">Logout</button>
      </header>

      <main class="app-shell">
        <section id="authView" class="auth-view">
          <div class="auth-card">
            <div class="auth-header">
              <p class="eyebrow">Welcome</p>
              <h2>Submit and track royalty claims</h2>
            </div>

            <div class="tab-switch" aria-label="Artist login selector">
              <button class="tab active" type="button" data-panel="login">Sign in</button>
              <button class="tab" type="button" data-panel="register">Register</button>
            </div>

            <div id="loginSection" class="panel">
              <form id="loginForm" class="form-grid">
                <label>
                  Email
                  <input type="email" id="loginEmail" placeholder="artist@example.com" required />
                </label>
                <label>
                  Password
                  <input type="password" id="loginPassword" placeholder="••••••••" required />
                </label>
                <button class="primary-btn" type="submit">Login to portal</button>
              </form>
            </div>

            <div id="registerSection" class="panel hidden">
              <form id="registerForm" class="form-grid">
                <label>
                  Full name
                  <input type="text" id="registerName" placeholder="Munezero Hubert" required />
                </label>
                <label>
                  Email
                  <input type="email" id="registerEmail" placeholder="artist@example.com" required />
                </label>
                <label>
                  Password
                  <input type="password" id="registerPassword" placeholder="Minimum 6 characters" required />
                </label>
                <button class="primary-btn" type="submit">Create artist account</button>
              </form>
            </div>

          </div>
        </section>

        <section id="dashboardView" class="dashboard hidden">
          <div class="welcome-row">
            <div>
              <p class="eyebrow">Artist dashboard</p>
              <h2 id="welcomeName">Welcome</h2>
            </div>
            <span class="status-badge">Claimant account</span>
          </div>

          <div class="stats-grid">
            <article class="stat-card">
              <span>Total claims</span>
              <strong id="totalClaims">0</strong>
            </article>
            <article class="stat-card accent">
              <span>Pending</span>
              <strong id="pendingClaims">0</strong>
            </article>
            <article class="stat-card success">
              <span>Approved</span>
              <strong id="approvedClaims">0</strong>
            </article>
          </div>

          <div class="content-grid">
            <section class="panel claim-form-panel">
              <div class="panel-header">
                <h3>Submit a new claim</h3>
              </div>

              <form id="claimForm" class="form-grid claim-form">
                <label>
                  Artist name
                  <input type="text" name="artist" placeholder="Your name" required />
                </label>
                <label>
                  Track title
                  <input type="text" name="track" placeholder="Song title" required />
                </label>
                <label>
                  Claim amount
                  <input type="number" name="amount" min="1" step="0.01" placeholder="2500" required />
                </label>
                <label>
                  Submission date
                  <input type="date" name="submittedDate" required />
                </label>
                <label class="full-width">
                  Notes
                  <textarea name="notes" rows="4" placeholder="Add details about the claim"></textarea>
                </label>
                <label class="full-width">
                  Supporting document
                  <input type="file" name="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" />
                </label>
                <button class="primary-btn full-width" type="submit">Submit claim</button>
              </form>
            </section>

            <section class="panel claims-panel">
              <div class="panel-header">
                <h3>Your claims</h3>
              </div>
              <ul id="claimsList" class="claims-list"></ul>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
